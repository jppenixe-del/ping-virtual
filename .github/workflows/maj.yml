name: Mise à jour Ping Pocket
on:
  schedule:
    - cron: "15 5 * * *"     # tous les matins
    - cron: "30 20 * * 0,6"  # et le soir des week-ends (jours de compétition)
  workflow_dispatch:
permissions:
  contents: write
concurrency: maj
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pingpocket.py
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "ping-virtual-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Mise à jour Ping Pocket"
          git push
