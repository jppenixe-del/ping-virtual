name: Fermer les demandes traitées
# Les données viennent du serveur ob1 (Ping Pocket bloque les serveurs de GitHub): quand il publie data/, on ferme
# les demandes « ajouter licence » dont la licence est maintenant suivie.
on:
  push:
    paths: ["data/**"]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  fermer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo ${{ github.repository }} --state open --search "ajouter licence in:title" --json number --jq '.[].number'); do
            LIC=$(gh issue view "$n" --repo ${{ github.repository }} --json title --jq .title | grep -oE '[0-9]{5,8}' | head -1)
            if [ -n "$LIC" ] && [ -f "data/$LIC.json" ]; then gh issue close "$n" --repo ${{ github.repository }} --comment "Licence ajoutée ✓ — retourne dans Ping Virtual."; fi
          done
