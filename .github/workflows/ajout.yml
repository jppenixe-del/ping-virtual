name: Ajouter une licence
# L'appli ouvre une « issue » « ajouter licence 1234567 » : on ajoute la licence à licences.txt, on va chercher ses
# données tout de suite et on ferme l'issue. Seulement les demandes du propriétaire du dépôt.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: maj
jobs:
  ajout:
    if: github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Licence demandée
        id: lic
        env:
          TITRE: ${{ github.event.issue.title }}
        run: |
          LIC=$(printf '%s' "$TITRE" | grep -oE '[0-9]{5,8}' | head -1)
          if [ -z "$LIC" ]; then echo "pas de numéro de licence"; exit 1; fi
          echo "lic=$LIC" >> "$GITHUB_OUTPUT"
          grep -qx "$LIC" licences.txt || echo "$LIC" >> licences.txt
      - run: python scripts/pingpocket.py ${{ steps.lic.outputs.lic }}
      - name: Publier
        run: |
          git config user.name "ping-virtual-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add licences.txt data
          git diff --cached --quiet || { git commit -m "Ajout de la licence ${{ steps.lic.outputs.lic }}"; git pull --rebase; git push; }
      - name: Fermer la demande
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then MSG="Licence ajoutée ✓ — retourne dans Ping Virtual."; else MSG="Échec — vérifie le numéro de licence."; fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "$MSG"
